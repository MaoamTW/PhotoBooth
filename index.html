<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photobooth IA Lunéville</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body { font-family:'Poppins', sans-serif; margin:0; background:#0f172a; color:white; }
header { padding:20px 40px; }
.hero { text-align:center; padding:100px 20px; }
.section { padding:60px 20px; max-width:600px; margin:auto; }
.reservation { background:#1e293b; padding:30px; border-radius:16px; }
input, select { width:100%; padding:12px; margin:10px 0; border-radius:8px; border:none; }
.total { font-size:22px; font-weight:600; margin-top:10px; }
.info { font-size:14px; color:#cbd5f5; }
.btn { background:#ff4d6d; padding:15px; border:none; width:100%; border-radius:10px; }
</style>
</head>

<body>

<section class="section">
<div class="reservation">

<h2>Réservation</h2>

<label>Date</label>
<input type="date" id="date">

<label>Ville ou adresse</label>
<input type="text" id="adresse" placeholder="Ex: Nancy" oninput="calculDistance()">

<div class="info" id="transportInfo"></div>

<label>Options IA</label>
<label><input type="checkbox" class="ia"> Costumes</label>
<label><input type="checkbox" class="ia"> Décor</label>
<label><input type="checkbox" class="ia"> Groupe</label>

<label>Impressions</label>
<select id="prints" onchange="calculTotal()">
<option value="70">100 impressions (70€)</option>
<option value="140">200 impressions (140€)</option>
<option value="210">300 impressions (210€)</option>
</select>

<div class="total" id="total">Total : 250€</div>

<button class="btn">Réserver</button>

</div>
</section>

<script>

let transportCost = 0;

async function calculDistance() {
  const adresse = document.getElementById('adresse').value;
  if (!adresse) return;

  try {
    const res = await fetch(`https://photon.komoot.io/api/?q=${adresse}`);
    const data = await res.json();

    if (!data.features || !data.features[0]) {
      document.getElementById('transportInfo').innerText = "";
      return;
    }

    const lat = data.features[0].geometry.coordinates[1];
    const lon = data.features[0].geometry.coordinates[0];

    const latL = 48.5929;
    const lonL = 6.4967;

    const R = 6371;
    const dLat = (lat - latL) * Math.PI / 180;
    const dLon = (lon - lonL) * Math.PI / 180;

    const a =
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(latL * Math.PI / 180) *
      Math.cos(lat * Math.PI / 180) *
      Math.sin(dLon / 2) *
      Math.sin(dLon / 2);

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    let distance = R * c;

    // correction dynamique
    if (distance < 10) distance *= 1.2;
    else if (distance < 30) distance *= 1.3;
    else distance *= 1.4;

    if (distance <= 15) {
      transportCost = 0;
      document.getElementById('transportInfo').innerText =
        `Distance : ${distance.toFixed(1)} km → Transport OFFERT`;
    } else {

      const kmPayant = distance - 15;

      // prix mini
      let prixMin = Math.ceil((kmPayant * 0.5) * 2) / 2;

      // 🔥 FOURCHETTE INTELLIGENTE
      let marge = Math.ceil(kmPayant / 5) * 0.5;
      let prixMax = prixMin + marge;

      transportCost = prixMin;

      document.getElementById('transportInfo').innerText =
        `Distance : ${distance.toFixed(1)} km → Transport : ${prixMin.toFixed(2)}€ à ${prixMax.toFixed(2)}€`;
    }

    calculTotal();

  } catch (e) {
    document.getElementById('transportInfo').innerText = "";
  }
}

function calculTotal() {
  let total = 250;

  const iaCount = document.querySelectorAll('.ia:checked').length;

  if (iaCount === 1) total += 60;
  if (iaCount === 2) total += 90;
  if (iaCount >= 3) total += 110;

  total += parseInt(document.getElementById('prints').value);
  total += transportCost;

  document.getElementById('total').innerText = "Total : " + total.toFixed(2) + "€";
}

document.querySelectorAll('.ia').forEach(el => el.addEventListener('change', calculTotal));

</script>

</body>
</html>
